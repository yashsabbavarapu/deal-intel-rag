[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deal-intel-rag"
version = "0.1.0"
description = "Local RAG over internal GTM docs with strict citations and refusal on low relevance"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=0.5.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6","pytest>=8.0"]

[project.scripts]
dealintel = "dealintel.cli:main"

[tool.setuptools]
packages = ["dealintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
